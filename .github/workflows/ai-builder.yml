name: AI Repository Builder

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'What would you like the AI to build?'
        required: true
        default: 'Scaffold a Java Spring Boot backend and Angular standalone frontend for a task manager app'
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  generate-code:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, '@ai-bot') || contains(github.event.issue.body, '@ai-bot')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install HTTP Library
        run: pip install requests

      - name: Call Free AI Model & Generate Files
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          USER_PROMPT: ${{ github.event.inputs.prompt || github.event.comment.body || github.event.issue.body }}
        run: |
          python - << 'EOF'
          import os, sys, json, re, time, requests

          api_key = os.environ.get("OPENROUTER_API_KEY", "").strip()
          if not api_key:
              print("::error::OPENROUTER_API_KEY secret is missing or empty in this repository.")
              sys.exit(1)

          user_prompt = os.environ.get("USER_PROMPT", "").replace("@ai-bot", "").strip()
          if not user_prompt:
              print("::error::User prompt was empty.")
              sys.exit(1)

          system_prompt = (
              "You are an expert full-stack developer. Build the requested application. "
              "Respond ONLY with a valid JSON array of objects. "
              "Format: [{\"path\": \"relative/path.ext\", \"content\": \"file contents here\"}]. "
              "Do not write markdown fences, conversational text, or explanation."
          )

          candidate_models = [
              "openrouter/free",
              "meta-llama/llama-3.3-70b-instruct:free"
          ]

          url = "https://openrouter.ai/api/v1/chat/completions"
          headers = {
              "Authorization": f"Bearer {api_key}",
              "HTTP-Referer": "https://github.com",
              "X-Title": "GitHub Actions AI Builder",
              "Content-Type": "application/json"
          }

          response_json = None
          for model in candidate_models:
              print(f"Attempting code generation with model: {model}...")
              payload = {
                  "model": model,
                  "messages": [
                      {"role": "system", "content": system_prompt},
                      {"role": "user", "content": user_prompt}
                  ],
                  "temperature": 0.2
              }
              try:
                  res = requests.post(url, headers=headers, json=payload, timeout=180)
                  if res.status_code == 200:
                      response_json = res.json()
                      print(f"Successfully received response from {model}.")
                      break
                  else:
                      print(f"::warning::{model} returned status {res.status_code}: {res.text}")
              except requests.exceptions.RequestException as e:
                  print(f"::warning::{model} network connection error: {e}")
              time.sleep(3)

          if not response_json or "choices" not in response_json:
              print("::error::All free model endpoints failed or timed out.")
              sys.exit(1)

          raw = response_json["choices"][0]["message"]["content"].strip()

          if "```" in raw:
              match = re.search(r"```(?:json)?\s*([\s\S]*?)\s*```", raw)
              if match:
                  raw = match.group(1).strip()

          try:
              files = json.loads(raw)
          except Exception as e:
              print("::error::Model response could not be parsed as JSON.")
              print("Raw response excerpt:\n", raw[:1200])
              sys.exit(1)

          for item in files:
              file_path = item["path"].lstrip("/").strip()
              dir_name = os.path.dirname(file_path)
              # Only create directory if path contains a parent folder
              if dir_name:
                  os.makedirs(dir_name, exist_ok=True)
              with open(file_path, "w", encoding="utf-8") as f:
                  f.write(item["content"])
              print(f"Created: {file_path}")

          print(f"Generated {len(files)} files successfully.")
          EOF

      - name: Commit and Push Code
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ai-generated-app
          git add .
          git commit -m "Scaffold project via OpenRouter free model"
          git push -u origin ai-generated-app --force

      - name: Post Comment on Issue
        if: success() && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: '🎉 Codebase successfully generated! View the code on branch [`ai-generated-app`](../../tree/ai-generated-app).'
            });
